name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (macOS)
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fixed Xcode and Swift versions
        run: |
          test "$(/usr/bin/uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Strict build and test bundle
        run: |
          swift build --build-tests --disable-automatic-resolution --skip-update \
            -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --skip-build --disable-automatic-resolution --skip-update

      - name: CLI smoke
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          test "$("$BIN_PATH/VoicelyCLI" --version)" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/Voicely/Resources/Info.plist)"
          "$BIN_PATH/VoicelyCLI" --help >/dev/null
