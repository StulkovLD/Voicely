name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (macOS)
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fixed Xcode and Swift versions
        run: |
          test "$(/usr/bin/uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Strict build and test bundle
        run: |
          swift package clean
          swift build --build-tests --disable-automatic-resolution --skip-update \
            -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --skip-build --disable-automatic-resolution --skip-update

      - name: CLI smoke (version comes from the app bundle it ships in)
        run: |
          set -eu
          BIN_PATH="$(swift build --show-bin-path)"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/Voicely/Resources/Info.plist)"
          APP="$RUNNER_TEMP/Voicely.app"
          mkdir -p "$APP/Contents/Helpers"
          cp Sources/Voicely/Resources/Info.plist "$APP/Contents/Info.plist"
          cp "$BIN_PATH/VoicelyCLI" "$APP/Contents/Helpers/voicely"
          test "$("$APP/Contents/Helpers/voicely" --version)" = "$VERSION"
          ln -s "$APP/Contents/Helpers/voicely" "$RUNNER_TEMP/voicely"
          test "$("$RUNNER_TEMP/voicely" --version)" = "$VERSION"
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          # Keep stdin open briefly: the server stops on EOF, before a pending reply.
          { printf '%s\n' "$INIT"; sleep 3; } | "$APP/Contents/Helpers/voicely" mcp | head -n 1 \
            | /usr/bin/grep -F "\"version\":\"$VERSION\"" >/dev/null
          "$BIN_PATH/VoicelyCLI" --help >/dev/null
